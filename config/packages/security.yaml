security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Sans cette section, ROLE_ADMIN ne donne accès qu'aux routes qui
    # demandent explicitement ROLE_ADMIN : un administrateur n'aurait pas pu
    # utiliser les actions réservées à ROLE_AGENT (ex. réorienter une demande),
    # alors que le cahier des charges lui donne un accès de supervision complet.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_AGENT, ROLE_RESPONSABLE, ROLE_CITOYEN]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/orientation/tester$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/services$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/services/\d+$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/procedures$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/procedures/\d+$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }