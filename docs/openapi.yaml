openapi: 3.0.3
info:
  title: Orient-Admin — API REST
  version: 1.0.0
  description: 'API du système d''orientation des citoyens vers les services administratifs.


    Authentification : `POST /api/login_check` renvoie un jeton JWT à envoyer dans l''en-tête `Authorization: Bearer <jeton>`.


    Rôles : `citoyen`, `agent`, `responsable`, `admin`. L''admin hérite des trois autres ; l''agent et le responsable ne s''héritent
    pas entre eux.


    Erreurs : corps JSON `{"error": "message"}`. Les routes marquées « rôles autorisés » répondent 401 sans jeton valide et
    403 si le rôle ne suffit pas (vérifié par `tests/Controller/AccesParRoleTest.php`).'
servers:
- url: http://127.0.0.1:8000
  description: Serveur local
tags:
- name: Authentification
- name: Orientation
- name: Services
- name: Procédures
- name: Demandes
- name: Créneaux
- name: Rendez-vous
- name: Avis
- name: Notifications
- name: Statistiques
- name: Journal
- name: Administration
- name: Moteur d'orientation
paths:
  /api/login_check:
    post:
      tags:
      - Authentification
      summary: 'Connexion : renvoie un jeton JWT'
      description: 'Réponse 401 si identifiants incorrects ou compte désactivé. Limitation des tentatives (ENF-04) : au-delà de
        5 échecs par minute pour un même e-mail et une même adresse IP, réponse 429 avec l''en-tête `Retry-After` (secondes).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
      security: []
      responses:
        '200':
          description: Jeton JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '429':
          description: Trop de tentatives de connexion
          headers:
            Retry-After:
              description: Secondes à attendre avant de réessayer
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /api/register:
    post:
      tags:
      - Authentification
      summary: Inscription d'un citoyen
      description: 'Le consentement au traitement des données personnelles est obligatoire (`consentement: true`) ; sa date est
        enregistrée (ENF-05).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom:
                  type: string
                prenom:
                  type: string
                email:
                  type: string
                password:
                  type: string
                  minLength: 8
                telephone:
                  type: string
                  description: Facultatif ; 6 à 15 chiffres, « + » au début accepté (espaces, points et tirets retirés).
                consentement:
                  type: boolean
                  description: Doit valoir true.
              required:
              - nom
              - email
              - password
              - consentement
      security: []
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilisateurResume'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '409':
          $ref: '#/components/responses/Conflit'
  /api/me:
    get:
      tags:
      - Authentification
      summary: Profil de l'utilisateur connecté
      description: 'Rôles autorisés : tout utilisateur connecté.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moi'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
    patch:
      tags:
      - Authentification
      summary: Modifie mon profil et mes préférences
      description: 'Rôles autorisés : tout utilisateur connecté. Seuls les champs listés sont pris en compte (jamais l''e-mail, le
        mot de passe, le rôle ni le service). Le canal `sms` exige un numéro de téléphone.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom:
                  type: string
                prenom:
                  type: string
                telephone:
                  type: string
                  nullable: true
                langue:
                  type: string
                  enum:
                  - fr
                  - mg
                canalNotification:
                  type: string
                  enum:
                  - email
                  - sms
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moi'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
    delete:
      tags:
      - Authentification
      summary: Supprime mon compte et mes données
      description: 'Rôles autorisés : citoyen (les comptes du personnel sont gérés par un administrateur). Supprime les demandes
        et leur historique, les rendez-vous, les avis et les notifications ; les exemples d''entraînement du moteur (anonymisés)
        et les lignes du journal d''audit sont conservés sans lien avec le compte. Le jeton déjà émis cesse de fonctionner.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                motDePasse:
                  type: string
              required:
              - motDePasse
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Compte supprimé (sans corps)
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
  /api/me/donnees:
    get:
      tags:
      - Authentification
      summary: Exporte toutes mes données personnelles (droit d'accès)
      description: 'Rôles autorisés : tout utilisateur connecté. JSON téléchargeable : profil, demandes avec historique, rendez-vous,
        avis, notifications et journal de mes actions (500 dernières lignes). Jamais le mot de passe.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Données du compte
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NonAuthentifie'
  /api/mot-de-passe/oublie:
    post:
      tags:
      - Authentification
      summary: Demande de lien de réinitialisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
      security: []
      responses:
        '202':
          description: Réponse identique que le compte existe ou non
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
  /api/mot-de-passe/reinitialiser:
    post:
      tags:
      - Authentification
      summary: Réinitialisation du mot de passe avec le jeton reçu par e-mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
              required:
              - token
              - password
      security: []
      responses:
        '200':
          description: Mot de passe modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
  /api/orientation/tester:
    post:
      tags:
      - Orientation
      summary: Teste le moteur d'orientation sur un texte (sans créer de demande)
      description: Public. `source` vaut `ia` (service Python) ou `mots_cles` (repli).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                texte:
                  type: string
              required:
              - texte
      security: []
      responses:
        '200':
          description: Recommandation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orientation'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
  /api/services:
    get:
      tags:
      - Services
      summary: Liste des services
      description: Le public ne voit que les services actifs ; l'admin (jeton facultatif) voit aussi les services inactifs.
        Avec `q`, la recherche tolère les fautes de frappe (« naisance » trouve « naissance »), ignore les accents et la casse,
        et trie du plus au moins pertinent ; `rubrique` filtre sur la catégorie du service.
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Recherche par mots-clés (nom, mots-clés, catégorie, mission)
      - name: rubrique
        in: query
        schema:
          type: string
        description: Catégorie du service (insensible à la casse et aux accents)
      security: []
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      tags:
      - Services
      summary: Crée un service
      description: 'Rôles autorisés : admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom:
                  type: string
                mission:
                  type: string
                categorie:
                  type: string
                adresse:
                  type: string
                horaires:
                  type: string
                contact:
                  type: string
                actif:
                  type: boolean
                motsCles:
                  type: string
              required:
              - nom
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
  /api/services/rubriques:
    get:
      tags:
      - Services
      summary: Rubriques du catalogue
      description: Catégories des services actifs, avec le nombre de services de chacune (tri alphabétique).
      security: []
      responses:
        '200':
          description: Rubriques
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    nom:
                      type: string
                    nombreServices:
                      type: integer
  /api/services/{id}:
    get:
      tags:
      - Services
      summary: Détail d'un service
      description: Un service inactif répond 404, sauf pour l'admin.
      parameters:
      - $ref: '#/components/parameters/Id'
      security: []
      responses:
        '200':
          description: Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          $ref: '#/components/responses/Introuvable'
    put:
      tags:
      - Services
      summary: Modifie un service (champs envoyés uniquement)
      description: 'Rôles autorisés : admin (tous les champs) et agent, pour SON service seulement : mission, adresse, horaires,
        contact et motsCles. L''agent qui envoie nom, categorie ou actif reçoit 403. Envoyer `null` vide un champ facultatif.'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nom:
                  type: string
                mission:
                  type: string
                categorie:
                  type: string
                adresse:
                  type: string
                horaires:
                  type: string
                contact:
                  type: string
                actif:
                  type: boolean
                motsCles:
                  type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Service modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/Introuvable'
    delete:
      tags:
      - Services
      summary: Désactive un service (suppression logique)
      description: 'Rôles autorisés : admin. Le service passe à `actif: false` (les demandes, rendez-vous et statistiques liés
        restent intacts) ; `PUT {"actif": true}` le réactive. Répéter l''appel renvoie encore 204.'
      parameters:
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Désactivé (sans corps)
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/Introuvable'
  /api/procedures:
    get:
      tags:
      - Procédures
      summary: Liste des procédures
      description: Le public ne voit que les procédures actives d'un service actif. Avec `inclureInactifs=true` et un jeton,
        l'admin voit aussi les procédures désactivées et l'agent celles de son service. `q` lance une recherche tolérante aux fautes
        de frappe (nom, service, rubrique, mots-clés, description, pièces) et `rubrique` filtre sur la catégorie du service.
      parameters:
      - name: serviceId
        in: query
        schema:
          type: integer
        description: Filtre par service
      - name: q
        in: query
        schema:
          type: string
        description: Recherche par mots-clés
      - name: rubrique
        in: query
        schema:
          type: string
        description: Catégorie du service
      - name: inclureInactifs
        in: query
        schema:
          type: boolean
        description: Ajoute les procédures désactivées (agent de leur service, admin)
      security: []
      responses:
        '200':
          description: Procédures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Procedure'
    post:
      tags:
      - Procédures
      summary: Crée une procédure
      description: 'Rôles autorisés : agent (pour son service) et admin. Crée la version 1 de l''historique. `etapes` et
        `documentsRequis` sont facultatifs.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcedureEcriture'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Procedure'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '404':
          $ref: '#/components/responses/Introuvable'
  /api/procedures/{id}:
    get:
      tags:
      - Procédures
      summary: Détail d'une procédure
      parameters:
      - $ref: '#/components/parameters/Id'
      security: []
      responses:
        '200':
          description: Procédure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Procedure'
        '404':
          $ref: '#/components/responses/Introuvable'
    put:
      tags:
      - Procédures
      summary: Modifie une procédure
      description: 'Rôles autorisés : agent (pour son service) et admin ; seul l''admin peut changer `serviceId`. Seules les clés
        envoyées sont modifiées ; `etapes` et `documentsRequis`, si présentes, remplacent toute la liste. Si le contenu change,
        une nouvelle version est enregistrée et `misAJourLe` est renouvelée ; sinon rien ne change. `{"actif": true}` réactive
        une procédure désactivée.'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcedureEcriture'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Procédure modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Procedure'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/Introuvable'
    delete:
      tags:
      - Procédures
      summary: Désactive une procédure (suppression logique)
      description: 'Rôles autorisés : agent (pour son service) et admin. La procédure passe à `actif: false` (invisible du public,
        historique conservé, version enregistrée) ; `PUT {"actif": true}` la réactive. Répéter l''appel renvoie encore 204.'
      parameters:
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Désactivée (sans corps)
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/Introuvable'
  /api/procedures/{id}/versions:
    get:
      tags:
      - Procédures
      summary: Historique des versions d'une procédure
      description: 'Rôles autorisés : agent (pour son service) et admin. De la plus récente à la plus ancienne ; chaque version
        contient l''instantané complet du contenu. Une procédure antérieure à l''historique reçoit sa version « État initial »
        à sa première modification.'
      parameters:
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcedureVersion'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/Introuvable'
  /api/procedures/{id}/verification:
    post:
      tags:
      - Procédures
      summary: Confirme que l'information est toujours exacte
      description: 'Rôles autorisés : agent (pour son service) et admin. Renseigne `verifieLe` ; aucune nouvelle version.'
      parameters:
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Procédure avec sa date de vérification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Procedure'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/Introuvable'
  /api/demandes:
    post:
      tags:
      - Demandes
      summary: Crée une demande (orientation automatique, ou service choisi)
      description: 'Rôles autorisés : tout utilisateur connecté.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                texte:
                  type: string
                serviceId:
                  type: integer
                  description: 'Optionnel : service choisi par le citoyen'
              required:
              - texte
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Demande créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Demande'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '404':
          $ref: '#/components/responses/Introuvable'
    get:
      tags:
      - Demandes
      summary: Liste des demandes (les siennes ; toutes pour agent, responsable et admin)
      description: 'Rôles autorisés : tout utilisateur connecté.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Demandes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Demande'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
  /api/demandes/{id}:
    get:
      tags:
      - Demandes
      summary: Détail d'une demande
      description: '403 si la demande n''est pas accessible à l''utilisateur. Rôles autorisés : tout utilisateur connecté.'
      parameters:
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Demande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Demande'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/Introuvable'
  /api/demandes/{id}/reorienter:
    patch:
      tags:
      - Demandes
      summary: Réoriente une demande vers un autre service (EF-19)
      description: 'Rôles autorisés : agent, admin.'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceId:
                  type: integer
              required:
              - serviceId
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Demande réorientée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Demande'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '404':
          $ref: '#/components/responses/Introuvable'
  /api/demandes/{id}/retour:
    post:
      tags:
      - Demandes
      summary: 'Retour du citoyen : le service recommandé était-il le bon ? (EF-18)'
      description: '403 si la demande appartient à un autre citoyen. 409 si le moteur n''a fait aucune recommandation. Rôles
        autorisés : citoyen, admin.'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pertinent:
                  type: boolean
              required:
              - pertinent
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Retour enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Demande'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/Introuvable'
        '409':
          $ref: '#/components/responses/Conflit'
        '422':
          $ref: '#/components/responses/RequeteInvalide'
  /api/demandes/{id}/statut:
    patch:
      tags:
      - Demandes
      summary: Change le statut d'une demande
      description: 'Rôles autorisés : agent, admin.'
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                statut:
                  type: string
                  enum:
                  - soumise
                  - orientee
                  - rendez_vous_pris
                  - en_traitement
                  - cloturee
                  - annulee
              required:
              - statut
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Demande modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Demande'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '404':
