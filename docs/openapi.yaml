  /api/admin/moteur/exemples/{id}:
    delete:
      tags:
      - Moteur d'orientation
      summary: Supprime un exemple
      description: 'Rôles autorisés : admin.'
      parameters:
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/Introuvable'
  /api/admin/moteur/reentrainer:
    post:
      tags:
      - Moteur d'orientation
      summary: Réentraîne le moteur avec les exemples en base
      description: '502 si le service Python est indisponible. Rôles autorisés : admin.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Résultat du réentraînement (version, nbSupplementaires…)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '502':
          description: Service d'orientation indisponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    NonAuthentifie:
      description: Jeton absent, invalide ou compte désactivé
    Interdit:
      description: Rôle insuffisant ou ressource d'un autre utilisateur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
    RequeteInvalide:
      description: Données invalides (400 ou 422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
    Introuvable:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
    Conflit:
      description: Action impossible dans l'état actuel (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
  schemas:
    Erreur:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    Message:
      type: object
      properties:
        message:
          type: string
    UtilisateurResume:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        prenom:
          type: string
        email:
          type: string
        role:
          type: string
    Moi:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        prenom:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        service:
          type: integer
          nullable: true
        telephone:
          type: string
          nullable: true
        langue:
          type: string
          enum:
          - fr
          - mg
        canalNotification:
          type: string
          enum:
          - email
          - sms
        consentementLe:
          type: string
          format: date-time
          nullable: true
    UtilisateurAdmin:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        prenom:
          type: string
        email:
          type: string
        role:
          type: string
        service:
          type: object
          properties:
            id:
              type: integer
            nom:
              type: string
          nullable: true
        actif:
          type: boolean
    ServiceResume:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        adresse:
          type: string
          nullable: true
        horaires:
          type: string
          nullable: true
    Service:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        mission:
          type: string
          nullable: true
        categorie:
          type: string
          nullable: true
        adresse:
          type: string
          nullable: true
        horaires:
          type: string
          nullable: true
        contact:
          type: string
          nullable: true
        actif:
          type: boolean
        motsCles:
          type: string
          nullable: true
    Procedure:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        description:
          type: string
          nullable: true
        delaiEstime:
          type: integer
          nullable: true
          description: Délai estimé, en jours
        frais:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
          description: Libellé libre de version
        numeroVersion:
          type: integer
          description: Numéro de la dernière version de l'historique
        source:
          type: string
          nullable: true
          description: Origine de l'information (texte de loi, site officiel, service...)
        misAJourLe:
          type: string
          format: date-time
          description: Date de la dernière modification du contenu
        verifieLe:
          type: string
          format: date-time
          nullable: true
          description: Date à laquelle un agent a confirmé que l'information est exacte
        actif:
          type: boolean
        avertissement:
          type: string
          description: Mention que l'information est indicative (ENF-13)
        service:
          type: object
          properties:
            id:
              type: integer
            nom:
              type: string
            categorie:
              type: string
              nullable: true
        etapes:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              ordre:
                type: integer
              description:
                type: string
        documentsRequis:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              libelle:
                type: string
              obligatoire:
                type: boolean
              remarque:
                type: string
                nullable: true
              exemplaires:
                type: integer
              ancienneteMaxMois:
                type: integer
                nullable: true
                description: Ancienneté maximale de la pièce, en mois
              ouObtenir:
                type: string
                nullable: true
    ProcedureEcriture:
      type: object
      description: Création et modification. Textes limités (nom 150, frais et version 50, source et ouObtenir 255).
      properties:
        serviceId:
          type: integer
          description: Obligatoire à la création ; à la modification, réservé à l'admin
        nom:
          type: string
        description:
          type: string
          nullable: true
        delaiEstime:
          type: integer
          nullable: true
          description: En jours (0 à 3650)
        frais:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        actif:
          type: boolean
        etapes:
          type: array
          description: Étapes dans l'ordre (texte, ou objet avec `description`) ; remplace toute la liste
          items:
            type: string
        documentsRequis:
          type: array
          description: Pièces à fournir ; remplace toute la liste
          items:
            type: object
            properties:
              libelle:
                type: string
              obligatoire:
                type: boolean
                default: true
              remarque:
                type: string
                nullable: true
              exemplaires:
                type: integer
                minimum: 1
                maximum: 20
                default: 1
              ancienneteMaxMois:
                type: integer
                nullable: true
                minimum: 1
                maximum: 600
              ouObtenir:
                type: string
                nullable: true
            required:
            - libelle
      required:
      - nom
    ProcedureVersion:
      type: object
      properties:
        numero:
          type: integer
        date:
          type: string
          format: date-time
        auteur:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            nom:
              type: string
        resume:
          type: string
          description: '« Création », « Modification : frais, étapes », « Désactivation », « Réactivation » ou « État initial »'
        contenu:
          type: object
          description: Instantané complet (nom, description, delaiEstime, frais, version, source, serviceId, actif, etapes, documentsRequis)
          additionalProperties: true
    Orientation:
      type: object
      properties:
        source:
          type: string
          enum:
          - ia
          - mots_cles
        service:
          $ref: '#/components/schemas/ServiceResume'
          nullable: true
        confiance:
          type: number
          nullable: true
        alternatives:
          type: array
          items:
            type: object
            properties:
              service:
                $ref: '#/components/schemas/ServiceResume'
              confiance:
                type: number
    Demande:
      type: object
      properties:
        id:
          type: integer
        texte:
          type: string
        statut:
          type: string
        confiance:
          type: number
          nullable: true
        retourPertinent:
          type: boolean
          nullable: true
        dateCreation:
          type: string
          format: date-time
        serviceRecommande:
          $ref: '#/components/schemas/ServiceResume'
          nullable: true
        serviceFinal:
          $ref: '#/components/schemas/ServiceResume'
          nullable: true
        citoyenId:
          type: integer
        citoyenNom:
          type: string
        citoyenPrenom:
          type: string
        alternatives:
          type: array
          items:
            type: object
            properties:
              service:
                $ref: '#/components/schemas/ServiceResume'
              confiance:
                type: number
        historique:
          type: array
          items:
            type: object
            properties:
              statut:
                type: string
              date:
                type: string
                format: date-time
    Creneau:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        heure:
          type: string
        disponible:
          type: boolean
        service:
          type: object
          properties:
            id:
              type: integer
            nom:
              type: string
    RendezVous:
      type: object
      properties:
        id:
          type: integer
        statut:
          type: string
          enum:
          - en_attente
          - confirme
          - refuse
          - annule
          - termine
          - absent
        date:
          type: string
          format: date
        heure:
          type: string
        creneauId:
          type: integer
        demande:
          type: object
          properties:
            id:
              type: integer
            texte:
              type: string
            statut:
              type: string
        service:
          type: object
          properties:
            id:
              type: integer
            nom:
              type: string
            adresse:
              type: string
              nullable: true
        citoyenId:
          type: integer
        citoyenNom:
          type: string
        citoyenPrenom:
          type: string
    Avis:
      type: object
      properties:
        id:
          type: integer
        note:
          type: integer
        commentaire:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        rendezVousId:
          type: integer
        rendezVousDate:
          type: string
          format: date
        service:
          type: object
          properties:
            id:
              type: integer
            nom:
              type: string
        citoyenNom:
          type: string
        citoyenPrenom:
          type: string
    Notification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        message:
          type: string
        statut:
          type: string
        lue:
          type: boolean
        date:
          type: string
          format: date-time
    Journal:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        date:
          type: string
          format: date-time
        adresseIp:
          type: string
          nullable: true
        details:
          type: string
          nullable: true
        utilisateur:
          type: object
          properties:
            id:
              type: integer
            nom:
              type: string
            prenom:
              type: string
            email:
              type: string
          nullable: true
    Exemple:
      type: object
      properties:
        id:
          type: integer
        texte:
          type: string
        origine:
          type: string
        service:
          type: object
          properties:
            id:
              type: integer
            nom:
              type: string
        demandeId:
          type: integer
          nullable: true
        dateCreation:
          type: string
          format: date-time
