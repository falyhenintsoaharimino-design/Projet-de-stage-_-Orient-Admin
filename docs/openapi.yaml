      parameters:
      - name: origine
        in: query
        schema:
          type: string
          enum:
          - reorientation
          - retour_citoyen
      - name: page
        in: query
        schema:
          type: integer
      - name: limite
        in: query
        schema:
          type: integer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Page d'exemples
          content:
            application/json:
              schema:
                type: object
