<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paramètres - Orient-Admin</title>
  <link rel="icon" type="image/png" href="../../assets/img/logo-orient-admin-icon.png">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-role="admin" data-page="parametres" data-root="../../">
  <div id="site-header"></div>
  <div class="app-shell">
    <aside id="site-sidebar"></aside>
    <main id="contenu" class="app-shell__main">
      <header class="page-head">
        <div>
          <h1>Paramètres</h1>
        </div>
      </header><div class="card">
        <h3>Notifications</h3>
        <div class="field">
          <label for="modele-email">Modèle d'e-mail de confirmation</label>
          <input type="text" id="modele-email" name="modele-email">
        </div>
        <div class="field">
          <label for="duree">Durée par défaut d'un créneau (minutes)</label>
          <input type="number" id="duree" name="duree" value="30">
        </div>
        <button class="btn btn--primary" type="button">Enregistrer</button>
      </div>
    </main>
  </div>
  <div id="site-footer"></div>
  <script src="../../assets/js/config/nav-config.js"></script>
  <script src="../../assets/js/components/layout.js"></script>
  <script src="../../assets/js/main.js"></script>
</body>
</html>
