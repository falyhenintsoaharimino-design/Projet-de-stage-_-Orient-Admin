<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue des services - Orient-Admin</title>
  <link rel="icon" type="image/png" href="../../assets/img/logo-orient-admin-icon.png">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-role="admin" data-page="services" data-root="../../">
  <div id="site-header"></div>
  <div class="app-shell">
    <aside id="site-sidebar"></aside>
    <main id="contenu" class="app-shell__main">
      <header class="page-head">
        <div>
          <h1>Catalogue des services</h1>
        </div>
        <div class="page-head__actions"><button class="btn btn--primary" type="button">Ajouter un service</button></div>
      </header><div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Service</th>
              <th>Rubrique</th>
              <th>Statut</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Acte de naissance</td>
              <td>État civil</td>
              <td><span class="badge badge--success">Actif</span></td>
            </tr>
            <tr>
              <td>Carte d'identité</td>
              <td>Citoyenneté</td>
              <td><span class="badge badge--success">Actif</span></td>
            </tr>
            <tr>
              <td>Casier judiciaire</td>
              <td>Justice</td>
              <td><span class="badge badge--success">Actif</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <div id="site-footer"></div>
  <script src="../../assets/js/config/nav-config.js"></script>
  <script src="../../assets/js/components/layout.js"></script>
  <script src="../../assets/js/main.js"></script>
</body>
</html>
