<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Communication - Orient-Admin</title>
  <link rel="icon" type="image/png" href="../../assets/img/logo-orient-admin-icon.png">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-role="agent" data-page="communication" data-root="../../">
  <div id="site-header"></div>
  <div class="app-shell">
    <aside id="site-sidebar"></aside>
    <main id="contenu" class="app-shell__main">
      <header class="page-head">
        <div>
          <h1>Communication</h1>
        </div>
      </header><div class="card">
        <div class="field">
          <label for="dest">Destinataire</label>
          <select id="dest" name="dest">
            <option value="Tous les citoyens du jour">Tous les citoyens du jour</option>
            <option value="Un citoyen en particulier">Un citoyen en particulier</option>
          </select>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Ex. : votre dossier nécessite une pièce complémentaire..."></textarea>
        </div>
        <button class="btn btn--primary" type="button">Envoyer</button>
      </div>
    </main>
  </div>
  <div id="site-footer"></div>
  <script src="../../assets/js/config/nav-config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/components/layout.js"></script>
  <script src="../../assets/js/main.js"></script>
</body>
</html>
