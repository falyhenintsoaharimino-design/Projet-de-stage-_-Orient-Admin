<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Performance de l'orientation - Orient-Admin</title>
  <link rel="icon" type="image/png" href="../../assets/img/logo-orient-admin-icon.png">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-role="responsable" data-page="performance-orientation" data-root="../../">
  <div id="site-header"></div>
  <div class="app-shell">
    <aside id="site-sidebar"></aside>
    <main id="contenu" class="app-shell__main">
      <header class="page-head">
        <div>
          <h1>Performance de l'orientation</h1>
        </div>
      </header><div class="card">
        <h3>Taux de bonne orientation par service</h3>
        <div>
          <div class="progress">
            <span>État civil</span>
            <div class="progress__track">
              <div class="progress__fill" style="--value: 94%"></div>
            </div>
            <span>94 %</span>
          </div>
          <div class="progress">
            <span>Fiscalité</span>
            <div class="progress__track">
              <div class="progress__fill" style="--value: 88%"></div>
            </div>
            <span>88 %</span>
          </div>
          <div class="progress">
            <span>Urbanisme</span>
            <div class="progress__track">
              <div class="progress__fill" style="--value: 79%"></div>
            </div>
            <span>79 %</span>
          </div>
          <div class="progress">
            <span>Aff. sociales</span>
            <div class="progress__track">
              <div class="progress__fill" style="--value: 85%"></div>
            </div>
            <span>85 %</span>
          </div>
          <div class="progress">
            <span>Légalisation</span>
            <div class="progress__track">
              <div class="progress__fill" style="--value: 92%"></div>
            </div>
            <span>92 %</span>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="site-footer"></div>
  <script src="../../assets/js/config/nav-config.js"></script>
  <script src="../../assets/js/components/layout.js"></script>
  <script src="../../assets/js/main.js"></script>
</body>
</html>
