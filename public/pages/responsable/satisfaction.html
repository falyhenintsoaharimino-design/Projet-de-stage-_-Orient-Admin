<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satisfaction - Orient-Admin</title>
  <link rel="icon" type="image/png" href="../../assets/img/logo-orient-admin-icon.png">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-role="responsable" data-page="satisfaction" data-root="../../">
  <div id="site-header"></div>
  <div class="app-shell">
    <aside id="site-sidebar"></aside>
    <main id="contenu" class="app-shell__main">
      <header class="page-head">
        <div>
          <h1>Satisfaction</h1>
        </div>
      </header><div class="grid grid--3">
        <div class="kpi">
          <p class="kpi__label">Note moyenne</p>
          <p class="kpi__value">4,4 / 5</p>
        </div>
        <div class="kpi">
          <p class="kpi__label">Avis collectés</p>
          <p class="kpi__value">612</p>
        </div>
        <div class="kpi kpi--success">
          <p class="kpi__label">Recommandation</p>
          <p class="kpi__value">88 %</p>
        </div>
      </div><div class="card">
        <h3 class="mt-5">Derniers commentaires</h3>
        <ul class="check-list">
          <li>« Rendez-vous rapide, personnel courtois. » - 5/5</li>
          <li>« Le service recommandé n'était pas le bon au début. » - 3/5</li>
        </ul>
      </div>
    </main>
  </div>
  <div id="site-footer"></div>
  <script src="../../assets/js/config/nav-config.js"></script>
  <script src="../../assets/js/components/layout.js"></script>
  <script src="../../assets/js/main.js"></script>
</body>
</html>
