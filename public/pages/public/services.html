<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue des services - Orient-Admin</title>
  <link rel="icon" type="image/png" href="../../assets/img/logo-orient-admin-icon.png">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-role="visiteur" data-page="services" data-root="../../">
  <div id="site-header"></div>
  <main id="contenu">
    <header class="page-head">
      <div>
        <h1>Catalogue des services</h1>
        <p class="text-muted">Parcourez les services par catégorie ou recherchez un mot-clé.</p>
      </div>
    </header><div class="field"><input type="search" id="recherche-services" placeholder="Rechercher un service..." aria-label="Rechercher"></div><div class="chips" id="chips-categories">
      <button class="chip is-active" type="button" data-filter="tous">Tous</button>
    </div><div class="mt-5">
      <div class="grid grid--3" id="liste-services"><p class="text-muted">Chargement des services...</p></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../../assets/js/config/nav-config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/components/layout.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/pages/services.js"></script>
</body>
</html>
