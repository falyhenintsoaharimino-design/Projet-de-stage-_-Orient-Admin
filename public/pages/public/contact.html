<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Orient-Admin</title>
  <link rel="icon" type="image/png" href="../../assets/img/logo-orient-admin-icon.png">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-role="visiteur" data-page="contact" data-root="../../">
  <div id="site-header"></div>
  <main id="contenu">
    <header class="page-head">
      <div>
        <h1>Contact</h1>
      </div>
    </header><div class="grid grid--main-aside">
      <div class="card">
        <div class="field"><label for="nom">Nom complet</label><input type="text" id="nom" name="nom" required></div>
        <div class="field"><label for="email">E-mail</label><input type="email" id="email" name="email" required></div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message"></textarea>
        </div>
        <button class="btn btn--primary" type="button">Envoyer</button>
      </div>
      <div class="card">
        <h3>Coordonnées</h3>
        <p class="text-muted">[Adresse, téléphone, horaires à compléter]</p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../../assets/js/config/nav-config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/components/layout.js"></script>
  <script src="../../assets/js/main.js"></script>
</body>
</html>
